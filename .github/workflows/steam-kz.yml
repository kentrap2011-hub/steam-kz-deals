name: Diagnose Steam KZ prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/steam-kz.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Diagnose first Kazakhstan Steam specials page
        shell: bash
        run: |
          cat > /tmp/diagnose.py <<'PY'
          import json
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          URL = "https://store.steampowered.com/search/results/"
          OUT = Path("data")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()

          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": (
                  "https://store.steampowered.com/search/"
                  "?specials=1&ignore_preferences=1&cc=kz"
              ),
          })

          session.cookies.update({
              "birthtime": "568022401",
              "lastagecheckage": "1-January-1988",
              "wants_mature_content": "1",
          })

          params = {
              "query": "",
              "start": 0,
              "count": 50,
              "dynamic_data": "",
              "sort_by": "_ASC",
              "specials": 1,
              "cc": "kz",
              "l": "english",
              "infinite": 1,
              "ignore_preferences": 1,
          }

          r = session.get(URL, params=params, timeout=40)
          r.raise_for_status()

          data = r.json()
          html = data.get("results_html", "")

          soup = BeautifulSoup(html, "html.parser")
          rows = soup.select("a.search_result_row")

          samples = []

          for row in rows[:20]:
              title_node = row.select_one("span.title")

              discount_block = row.select_one(
                  ".search_discount_and_price"
              )

              final_node = row.select_one(
                  ".discount_final_price"
              )

              original_node = row.select_one(
                  ".discount_original_price"
              )

              discount_node = row.select_one(
                  ".discount_pct"
              )

              price_nodes = row.select(
                  "[class*='price'], [class*='discount']"
              )

              samples.append({
                  "title": (
                      title_node.get_text(" ", strip=True)
                      if title_node else None
                  ),

                  "row_attributes": dict(row.attrs),

                  "row_text": row.get_text(
                      " ", strip=True
                  ),

                  "discount_percent_text": (
                      discount_node.get_text(
                          " ", strip=True
                      )
                      if discount_node else None
                  ),

                  "original_price_text": (
                      original_node.get_text(
                          " ", strip=True
                      )
                      if original_node else None
                  ),

                  "final_price_text": (
                      final_node.get_text(
                          " ", strip=True
                      )
                      if final_node else None
                  ),

                  "discount_block_text": (
                      discount_block.get_text(
                          " ", strip=True
                      )
                      if discount_block else None
                  ),

                  "discount_block_html": (
                      str(discount_block)[:4000]
                      if discount_block else None
                  ),

                  "price_related_nodes": [
                      {
                          "tag": node.name,
                          "class": node.get("class"),
                          "attrs": dict(node.attrs),
                          "text": node.get_text(
                              " ", strip=True
                          ),
                      }
                      for node in price_nodes[:20]
                  ],
              })

          output = {
              "http_status": r.status_code,
              "response_keys": list(data.keys()),
              "total_count": data.get("total_count"),
              "page_rows": len(rows),
              "samples": samples,
              "results_html_start": html[:5000],
          }

          path = OUT / "diagnostic_first_page.json"

          path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              json.dumps(
                  {
                      "total_count": output["total_count"],
                      "page_rows": output["page_rows"],
                      "samples_saved": len(samples),
                  },
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

          python /tmp/diagnose.py

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"

          git add data/diagnostic_first_page.json

          if git diff --cached --quiet; then
            echo "No diagnostic changes"
            exit 0
          fi

          git commit -m "Add Steam KZ price diagnostic"
          git push
