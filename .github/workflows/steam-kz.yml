name: Update Steam KZ deals

on:
  workflow_dispatch:
  schedule:
    # 07:17 по Самаре — до утренней рассылки
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/steam-kz.yml"

permissions:
  contents: write

concurrency:
  group: steam-kz-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect current Kazakhstan Steam specials
        shell: bash
        run: |
          cat > /tmp/collect.py <<'PY'
          import json
          import re
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse

          import requests
          from bs4 import BeautifulSoup

          URL = "https://store.steampowered.com/search/results/"
          PAGE_SIZE = 50
          MAX_KZT = 3500
          OUT = Path("data")
          OUT.mkdir(exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": (
                  "https://store.steampowered.com/search/"
                  "?specials=1&ignore_preferences=1&cc=kz"
              ),
          })

          session.cookies.update({
              "birthtime": "568022401",
              "lastagecheckage": "1-January-1988",
              "wants_mature_content": "1",
          })


          def kzt(text):
              if not text:
                  return None

              text = text.replace("\xa0", " ")
              matches = re.findall(r"([\d\s,.]+)\s*₸", text)

              if not matches:
                  return None

              digits = re.sub(r"\D", "", matches[-1])
              return int(digits) if digits else None


          def discount(text):
              if not text:
                  return None

              m = re.search(r"-\s*(\d{1,3})\s*%", text)
              return int(m.group(1)) if m else None


          def steam_identity(row, href):
              appid = row.get("data-ds-appid")
              if appid:
                  return "app", appid.split(",")[0]

              subid = row.get("data-ds-packageid")
              if subid:
                  return "sub", subid

              bundleid = row.get("data-ds-bundleid")
              if bundleid:
                  return "bundle", bundleid

              path = urlparse(href).path

              for kind, pattern in [
                  ("app", r"/app/(\d+)"),
                  ("sub", r"/sub/(\d+)"),
                  ("bundle", r"/bundle/(\d+)"),
              ]:
                  m = re.search(pattern, path)
                  if m:
                      return kind, m.group(1)

              return "unknown", ""


          def get_page(start):
              params = {
                  "query": "",
                  "start": start,
                  "count": PAGE_SIZE,
                  "dynamic_data": "",
                  "sort_by": "_ASC",
                  "specials": 1,
                  "cc": "kz",
                  "l": "english",
                  "infinite": 1,
                  "ignore_preferences": 1,
              }

              last_error = None

              for attempt in range(1, 7):
                  try:
                      r = session.get(URL, params=params, timeout=35)
                      r.raise_for_status()
                      return r.json()

                  except Exception as e:
                      last_error = e
                      wait = min(30, 2 ** attempt)
                      print(
                          f"Retry {attempt}/6 start={start}: "
                          f"{e}; wait {wait}s"
                      )
                      time.sleep(wait)

              raise RuntimeError(
                  f"Failed start={start}: {last_error}"
              )


          started = datetime.now(timezone.utc)

          start = 0
          requests_made = 0
          total = None
          rows_seen = 0

          all_ids = set()
          cheap = {}
          unparsed = {}

          while True:
              data = get_page(start)
              requests_made += 1

              try:
                  total = int(data["total_count"])
              except Exception:
                  pass

              soup = BeautifulSoup(
                  data.get("results_html", ""),
                  "html.parser"
              )

              rows = soup.select("a.search_result_row")
              rows_seen += len(rows)

              print(
                  f"start={start} rows={len(rows)} "
                  f"total={total}"
              )

              if not rows:
                  break

              for row in rows:
                  title_node = row.select_one("span.title")
                  if not title_node:
                      continue

                  title = title_node.get_text(" ", strip=True)
                  href = (row.get("href") or "").strip()

                  kind, steam_id = steam_identity(row, href)

                  unique_key = (
                      f"{kind}:{steam_id}"
                      if steam_id
                      else href
                  )
                  all_ids.add(unique_key)

                  discount_node = row.select_one(".discount_pct")
                  final_node = row.select_one(
                      ".discount_final_price"
                  )
                  original_node = row.select_one(
                      ".discount_original_price"
                  )
                  release_node = row.select_one(
                      ".search_released"
                  )

                  d = discount(
                      discount_node.get_text(" ", strip=True)
                      if discount_node else ""
                  )

                  final_text = (
                      final_node.get_text(" ", strip=True)
                      if final_node else ""
                  )

                  original_text = (
                      original_node.get_text(" ", strip=True)
                      if original_node else ""
                  )

                  final_price = kzt(final_text)
                  original_price = kzt(original_text)

                  item = {
                      "type": kind,
                      "steam_id": steam_id,
                      "appid": (
                          steam_id
                          if kind == "app"
                          else None
                      ),
                      "title": title,
                      "discount_percent": d,
                      "original_kzt": original_price,
                      "final_kzt": final_price,
                      "release_date": (
                          release_node.get_text(
                              " ", strip=True
                          )
                          if release_node else ""
                      ),
                      "url": href,
                  }

                  if (
                      d is not None
                      and d > 0
                      and final_price is not None
                      and 0 < final_price <= MAX_KZT
                  ):
                      cheap[unique_key] = item

                  elif (
                      d is not None
                      and d > 0
                      and final_price is None
                  ):
                      unparsed[unique_key] = item

              start += PAGE_SIZE

              if total is not None and start >= total:
                  break

              time.sleep(0.45)

          finished = datetime.now(timezone.utc)

          complete = (
              total is not None
              and start >= total
          )

          items = sorted(
              cheap.values(),
              key=lambda x: (
                  x["final_kzt"],
                  x["title"].casefold()
              )
          )

          metadata = {
              "collector_version": 1,
              "source": "Steam Store",
              "region": "Kazakhstan",
              "country_code": "kz",
              "specials_only": True,
              "ignore_preferences": True,
              "max_saved_price_kzt": MAX_KZT,
              "started_at_utc": started.isoformat(),
              "updated_at_utc": finished.isoformat(),
              "steam_total_reported": total,
              "rows_seen": rows_seen,
              "unique_rows_seen": len(all_ids),
              "requests_made": requests_made,
              "cheap_items_saved": len(items),
              "unparsed_discounted_items": len(unparsed),
              "complete": complete,
          }

          # Основной манифест
          (OUT / "manifest.json").write_text(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          # Разбиваем дешёвый каталог на небольшие файлы,
          # чтобы его потом было удобно читать автоматически.
          buckets = [
              (0, 1000),
              (1001, 2000),
              (2001, 3000),
              (3001, MAX_KZT),
          ]

          for low, high in buckets:
              subset = [
                  x for x in items
                  if low <= x["final_kzt"] <= high
              ]

              filename = (
                  f"deals_{low:04d}_{high:04d}.json"
              )

              (OUT / filename).write_text(
                  json.dumps(
                      {
                          "metadata": {
                              **metadata,
                              "range_kzt": [low, high],
                              "item_count": len(subset),
                          },
                          "items": subset,
                      },
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

          (OUT / "unparsed_prices.json").write_text(
              json.dumps(
                  {
                      "metadata": metadata,
                      "items": list(unparsed.values()),
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )

          print(
              json.dumps(
                  metadata,
                  ensure_ascii=False,
                  indent=2
              )
          )

          if not complete:
              raise SystemExit(
                  "Steam traversal did not reach "
                  "the reported end"
              )
          PY

          python /tmp/collect.py

      - name: Commit fresh catalog
        shell: bash
        run: |
          git config user.name "steam-kz-bot"
          git config user.email "steam-kz-bot@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update Steam KZ deals"
          git push
